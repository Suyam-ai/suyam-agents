[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suyam-agents"
version = "0.1.0"
description = "Suyam step handler plugins — standalone package with pluggy entry_points"
requires-python = ">=3.11"
dependencies = [
    "pluggy>=1.3",
    "anthropic>=0.105",
    "pydantic-ai[anthropic,groq]>=1.104.0",
    "httpx>=0.27",
    "anyio>=4.0",
]

[project.optional-dependencies]
m365 = [
    "msgraph-sdk>=1.58.0",
    "azure-identity>=1.19",
]

[project.entry-points."suyam"]
ai    = "suyam_agents.ai:plugin"
email = "suyam_agents.email:plugin"
teams = "suyam_agents.teams:plugin"
http  = "suyam_agents.http:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/suyam_agents"]
